[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Electron is only needed for the desktop app; skip its binary download on Netlify
  ELECTRON_SKIP_BINARY_DOWNLOAD = "1"

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://uploads.mangadex.org https://*.mangadex.network:* https://picsum.photos https://fastly.picsum.photos; connect-src 'self' https://api.mangadex.org https://uploads.mangadex.org https://*.mangadex.network:* https://picsum.photos https://fastly.picsum.photos; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
