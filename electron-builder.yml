appId: com.mangaku.app
productName: MangaKu
copyright: Copyright © 2024 MangaKu

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - electron/**/*
  - public/**/*
  - package.json
  - node_modules/**/*

win:
  target:
    - target: nsis
      arch:
        - x64
        - ia32
    - target: portable
      arch:
        - x64
  icon: public/icon.svg
  artifactName: ${productName}-${version}-Setup.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  shortcutName: MangaKu
  installerIcon: public/icon.svg
  uninstallerIcon: public/icon.svg
  installerHeaderIcon: public/icon.svg
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutCommands:
    - name: MangaKu
      description: Baca Manga Online & Offline

portable:
  artifactName: ${productName}-${version}-Portable.${ext}

mac:
  target:
    - dmg
    - zip
  icon: public/icon.svg
  category: public.app-category.entertainment

linux:
  target:
    - AppImage
    - deb
  icon: public/icon.svg
  category: Graphics
